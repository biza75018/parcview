<style>
[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b27; --surface2: #1e2535;
  --border: #2a3348; --text: #e6eaf4; --text2: #a0aabf; --muted: #5a6685;
  --accent: #C0001A; --green: #2dca8c; --green-bg: rgba(45,202,140,.12);
  --red: #e83548; --red-bg: rgba(232,53,72,.12);
  --blue: #4188ff; --blue-bg: rgba(65,136,255,.1);
  --shadow: 0 8px 32px rgba(0,0,0,.5);
}
[data-theme="light"] {
  --bg: #f0f2f7; --surface: #fff; --surface2: #f5f7fc;
  --border: #dde1ee; --text: #1a1f2e; --text2: #4a5270; --muted: #8a93b0;
  --accent: #C0001A; --green: #18a870; --green-bg: rgba(24,168,112,.1);
  --red: #d42638; --red-bg: rgba(212,38,56,.1);
  --blue: #2b6ef5; --blue-bg: rgba(43,110,245,.08);
  --shadow: 0 4px 20px rgba(0,0,0,.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'DM Sans', sans-serif; min-height: 100vh;
  transition: background .3s, color .3s;
}
.page {
  max-width: 480px; margin: 0 auto; padding: 24px 16px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
/* HEADER */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0 8px;
}
.logo-row { display: flex; align-items: center; gap: 10px; }
.logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; }
.logo-sub { font-size: .65rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: .8rem;
  color: var(--text2); transition: all .15s; font-family: 'DM Sans', sans-serif;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
/* CARD */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px;
}
.card-title {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: .95rem;
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}
/* FORMULAIRE POSITION */
.fi {
  width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 14px 16px; color: var(--text);
  font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 700;
  text-align: center; transition: border .15s; letter-spacing: .05em;
}
.fi:focus { outline: none; border-color: var(--accent); }
.fi::placeholder { color: var(--muted); font-size: 1rem; font-weight: 400; }
.fl {
  font-size: .7rem; color: var(--muted); display: block; margin-bottom: 7px;
  font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
}
.fg { margin-bottom: 14px; }
.btn-main {
  width: 100%; padding: 15px; border-radius: 12px; border: none;
  background: var(--accent); color: #fff;
  font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: opacity .15s; margin-top: 4px;
}
.btn-main:hover { opacity: .88; }
.btn-main:active { transform: scale(.98); }
/* NOTIF */
.notif {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 20px; font-size: .88rem; font-weight: 600;
  box-shadow: var(--shadow); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index: 999; white-space: nowrap; border-left: 3px solid var(--green);
}
.notif.show { transform: translateX(-50%) translateY(0); }
.notif.error { border-left-color: var(--red); }
/* PLAN PARC */
.parc-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.pl-item { display: flex; align-items: center; gap: 5px; font-size: .72rem; color: var(--text2); }
.pl-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.parc-wrap { display: inline-flex; gap: 6px; min-width: 100%; overflow-x: auto; padding-bottom: 4px; }
.parc-col { display: flex; flex-direction: column; gap: 3px; }
.parc-col-label {
  font-size: .55rem; color: #0af; text-transform: uppercase;
  letter-spacing: .06em; text-align: center; margin-bottom: 3px;
}
.parc-col-label.therm { color: var(--muted); }
.slot {
  width: 52px; height: 32px; border-radius: 6px;
  border: 1.5px solid var(--border); display: flex; flex-direction: column;
  align-items: center; justify-content: center; position: relative;
  font-size: .58rem; flex-shrink: 0;
}
.slot.ok { background: var(--green-bg); border-color: var(--green); }
.slot.immo { background: var(--red-bg); border-color: var(--red); }
.slot.mine { background: var(--accent); border-color: var(--accent); }
.slot.atelier { background: rgba(255,140,0,.15); border-color: orange; cursor: default; }
.slot.gnv-empty { border-style: dashed; border-color: rgba(0,170,255,.4); }
.slot-num { position: absolute; top: 2px; left: 3px; font-size: .48rem; color: var(--muted); }
.slot-id { font-weight: 700; font-size: .6rem; text-align: center; line-height: 1.1; }
.slot-ico { font-size: .5rem; }
/* MA POSITION */
.ma-pos-card {
  background: var(--accent); border-radius: 12px; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
}
.ma-pos-icon { font-size: 2rem; }
.ma-pos-label { font-size: .72rem; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .06em; }
.ma-pos-val { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.4rem; color: #fff; }
.ma-pos-bus { font-size: .8rem; color: rgba(255,255,255,.8); margin-top: 2px; }
/* SEPARATEUR */
.col-sep { width: 10px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="notif" id="notif"></div>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <div class="logo-row">
      <svg width="36" height="36" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#C0001A"/>
        <rect x="7" y="7" width="14" height="9" rx="2.5" fill="white" opacity="0.22"/>
        <rect x="25" y="7" width="14" height="9" rx="2.5" fill="white" opacity="0.95"/>
        <rect x="43" y="7" width="14" height="9" rx="2.5" fill="white" opacity="0.22"/>
        <rect x="7" y="19" width="14" height="9" rx="2.5" fill="white" opacity="0.95"/>
        <rect x="25" y="19" width="14" height="9" rx="2.5" fill="white" opacity="0.22"/>
        <rect x="43" y="19" width="14" height="9" rx="2.5" fill="white" opacity="0.95"/>
        <rect x="7" y="31" width="14" height="9" rx="2.5" fill="white" opacity="0.22"/>
        <rect x="25" y="31" width="14" height="9" rx="2.5" fill="white" opacity="0.95"/>
        <rect x="43" y="31" width="14" height="9" rx="2.5" fill="white" opacity="0.22"/>
        <ellipse cx="32" cy="52" rx="20" ry="10" fill="none" stroke="white" stroke-width="2.5"/>
        <circle cx="32" cy="52" r="7" fill="white"/>
        <circle cx="32" cy="52" r="3.5" fill="#C0001A"/>
        <circle cx="35" cy="49" r="2" fill="white" opacity="0.55"/>
      </svg>
      <div>
        <div class="logo-text">ParcView</div>
        <div class="logo-sub">Interface Conducteur</div>
      </div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ Jour</button>
  </div>

  <!-- MA POSITION ACTUELLE -->
  <div id="ma-pos-wrap" style="display:none">
    <div class="ma-pos-card">
      <div class="ma-pos-icon">📍</div>
      <div>
        <div class="ma-pos-label">Ma position actuelle</div>
        <div class="ma-pos-val">Place <span id="ma-pos-place">—</span></div>
        <div class="ma-pos-bus">Bus <span id="ma-pos-bus">—</span></div>
      </div>
    </div>
  </div>

  <!-- DÉCLARER MA POSITION -->
  <div class="card">
    <div class="card-title">📍 Déclarer ma position</div>
    <div class="fg">
      <label class="fl">Mon numéro de parc</label>
      <input class="fi" id="c-bus" type="number" placeholder="ex : 207080" inputmode="numeric">
    </div>
    <div class="fg">
      <label class="fl">Numéro de place (1 → 75)</label>
      <input class="fi" id="c-place" type="number" placeholder="ex : 12" min="1" max="75" inputmode="numeric">
    </div>
    <button class="btn-main" onclick="declarerPosition()">✅ Confirmer ma position</button>
  </div>

  <!-- PLAN DU PARC -->
  <div class="card">
    <div class="card-title">🗺️ Plan du parc</div>
    <div class="parc-legend">
      <div class="pl-item"><div class="pl-dot" style="background:var(--green-bg);border:1px solid var(--green)"></div>En service</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--red-bg);border:1px solid var(--red)"></div>Immobilisé</div>
      <div class="pl-item"><div class="pl-dot" style="background:var(--accent)"></div>Ma place</div>
      <div class="pl-item"><div class="pl-dot" style="border:1.5px dashed rgba(0,170,255,.5);background:transparent"></div>Zone GNV</div>
    </div>
    <div style="overflow-x:auto;padding-bottom:8px">
      <div class="parc-wrap" id="parc-plan"></div>
    </div>
    <div style="margin-top:10px;font-size:.7rem;color:var(--muted)">
      🟠 Places 73-74-75 : Zone Atelier &nbsp;|&nbsp; 🔵 Places 1-61 : Équipées GNV
    </div>
  </div>

  <div style="text-align:center;font-size:.7rem;color:var(--muted);padding-top:4px">
    ParcView · Transdev Express Roissy
  </div>

</div>

<script>
// ===== API GOOGLE SHEETS (même base que l'app principale) =====
const API_URL = 'https://script.google.com/macros/s/AKfycbwNAeTqArGvvqsSPi2iFXSV7-h4viM_zCctyHZl4znSaCHsQqpM4Q9_LGj3Fk1VoXbLsg/exec';

async function apiGet() {
  try {
    const res = await fetch(API_URL + '?action=getAll');
    return await res.json();
  } catch(e) { return null; }
}
async function apiPost(body) {
  try {
    await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
  } catch(e) { console.error('API POST error', e); }
}

const S = {
  get:  k => { try { return JSON.parse(localStorage.getItem('fw2_'+k)) || [] } catch { return [] } },
  set:  (k,v) => localStorage.setItem('fw2_'+k, JSON.stringify(v)),
  geto: k => { try { return JSON.parse(localStorage.getItem('fw2_'+k)) || {} } catch { return {} } },
  seto: (k,v) => localStorage.setItem('fw2_'+k, JSON.stringify(v)),
};

const ATELIER = new Set([73,74,75]);
const GNV_PLACES = new Set(Array.from({length:61},(_,i)=>i+1));
const LAYOUT = {
  col1: Array.from({length:16},(_,i)=>16-i),
  col2: Array.from({length:16},(_,i)=>32-i),
  col3: Array.from({length:15},(_,i)=>47-i),
  col4: Array.from({length:14},(_,i)=>61-i),
  col5: Array.from({length:14},(_,i)=>75-i),
};

let parcPos = {}, vehicules = [], immobilisations = [];
let maPlace = localStorage.getItem('pv_cond_place') || null;
let maBus   = localStorage.getItem('pv_cond_bus')   || null;

async function loadData() {
  try {
    const remote = await apiGet();
    if (remote && remote.vehicules) {
      vehicules = remote.vehicules.map(v => ({
        id: String(v.N_PARC), type: v.TYPE, marque: v.MARQUE, modele: v.MODELE,
        energie: v.ENERGIE, immat: v.IMMAT, km_mai2026: Number(v.KM_MAI2026)||0,
        date_entree: v.DATE_ENTREE, place: v.PLACE||null
      }));
      immobilisations = remote.immobilisations.map(i => ({
        id: String(i.ID), parc: String(i.N_PARC), motif: i.MOTIF,
        debut: i.DEBUT, finPrevue: i.FIN_PREVUE||null, finReelle: i.FIN_REELLE||null,
        resp: i.RESPONSABLE, obs: i.OBSERVATIONS, statut: i.STATUT
      }));
      parcPos = {};
      remote.parc.forEach(p => { if(p.PLACE && p.N_PARC) parcPos[String(p.PLACE)] = {parc: String(p.N_PARC)}; });
      S.set('vehicules', vehicules);
      S.set('immo', immobilisations);
      S.seto('parc', parcPos);
    } else {
      throw new Error('pas de données');
    }
  } catch(e) {
    // Fallback cache local
    parcPos        = S.geto('parc');
    vehicules      = S.get('vehicules');
    immobilisations = S.get('immo');
  }
}

function getStatus(parcId) {
  return immobilisations.some(i => i.parc === String(parcId) && i.statut === 'En cours') ? 'immo' : 'ok';
}

function notify(msg, type='success') {
  const n = document.getElementById('notif');
  n.className = 'notif show' + (type==='error'?' error':'');
  n.textContent = (type==='success'?'✅ ':'❌ ') + msg;
  clearTimeout(n._t);
  n._t = setTimeout(() => n.classList.remove('show'), 3500);
}

// ===== DÉCLARER POSITION =====
function declarerPosition() {
  const bus   = document.getElementById('c-bus').value.trim();
  const place = parseInt(document.getElementById('c-place').value);
  if (!bus)              { notify('Saisis ton numéro de parc', 'error'); return; }
  if (!place||place<1||place>75) { notify('Numéro de place invalide (1 à 75)', 'error'); return; }
  if (ATELIER.has(place)) { notify('Place réservée à l\'atelier', 'error'); return; }

  loadData();
  // Libérer ancienne position de ce bus
  Object.keys(parcPos).forEach(k => { if (parcPos[k]?.parc === bus) delete parcPos[k]; });
  parcPos[String(place)] = { parc: bus };
  S.seto('parc', parcPos);

  // Sync Google Sheets
  const parcRows = Object.entries(parcPos).filter(([_,v])=>v).map(([pl,occ])=>[pl, occ.parc]);
  apiPost({action:'save', sheet:'PARC', mode:'replace', rows: parcRows.length ? parcRows : [['','']]});

  // Sauvegarder ma position locale
  maPlace = String(place);
  maBus   = bus;
  localStorage.setItem('pv_cond_place', maPlace);
  localStorage.setItem('pv_cond_bus',   maBus);

  renderMaPosition();
  renderParc();
  notify(`Bus ${bus} → Place ${place} enregistré !`);
  document.getElementById('c-bus').value   = '';
  document.getElementById('c-place').value = '';
}

// ===== MA POSITION =====
function renderMaPosition() {
  const wrap = document.getElementById('ma-pos-wrap');
  if (maPlace && maBus) {
    wrap.style.display = 'block';
    document.getElementById('ma-pos-place').textContent = maPlace;
    document.getElementById('ma-pos-bus').textContent   = maBus;
  } else {
    wrap.style.display = 'none';
  }
}

// ===== PLAN DU PARC =====
function renderParc() {
  loadData();
  const container = document.getElementById('parc-plan');
  let html = '';

  Object.entries(LAYOUT).forEach(([col, places], idx) => {
    const isGNVcol = idx < 4;
    html += `<div class="parc-col">`;
    html += `<div class="parc-col-label ${isGNVcol?'':'therm'}">${isGNVcol?'GNV':' '}</div>`;

    places.forEach(num => {
      const isAtelier = ATELIER.has(num);
      const isGNV     = GNV_PLACES.has(num);
      const occ       = parcPos[String(num)];
      const parcId    = occ?.parc || null;
      const isMine    = parcId === maBus && maPlace === String(num);
      const s         = parcId ? getStatus(parcId) : 'empty';

      let cls = 'slot ';
      if (isAtelier)    cls += 'atelier';
      else if (isMine)  cls += 'mine';
      else if (parcId)  cls += s;
      else if (isGNV)   cls += 'gnv-empty';

      const label = isAtelier ? '🔧' : isMine ? '📍 MOI' : parcId ? parcId : 'Libre';
      const ico   = (!isAtelier && !isMine && parcId) ? (s==='immo'?'🔴':'🟢') : '';

      html += `<div class="${cls}" title="Place ${num}${parcId?' — Bus '+parcId:''}">
        <span class="slot-num">${num}</span>
        <span class="slot-id">${label}</span>
        ${ico ? `<span class="slot-ico">${ico}</span>` : ''}
      </div>`;
    });

    html += `</div>`;
    // Séparateur entre les groupes
    if (idx === 1 || idx === 3) html += `<div class="col-sep"></div>`;
  });

  container.innerHTML = html;
}

// ===== THÈME =====
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = dark ? '🌙 Nuit' : '☀️ Jour';
  localStorage.setItem('fw2_theme', dark ? 'light' : 'dark');
}

// ===== INIT =====
function init() {
  // Thème
  const t = localStorage.getItem('fw2_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️ Jour' : '🌙 Nuit';

  // Pré-remplir numéro de bus si connu
  if (maBus) document.getElementById('c-bus').value = maBus;

  renderMaPosition();
  loadData().then(() => renderParc());

  // Rafraîchir le plan toutes les 30 secondes
  setInterval(() => { loadData().then(() => renderParc()); }, 30000);
}

init();
</script>
</body>
</html>
